# Override versionado para CI, stacks de mutantes e máquinas sem as chaves do S3:
# o seed carrega a fixture sintética de data/fixture (nada é baixado).
#   docker compose -f compose.yaml -f compose.ci.yaml up -d --build --wait
services:
  # CI, mutantes e validação sem modelo: comportamento determinístico (PRD-003).
  api:
    environment:
      INTERPRETADOR: "regras"
      # A fixture tem 6 transações elegíveis, 4 delas de uma persona, e as jornadas E2E registram um
      # pré-caso por consumidor e navegador em segundos: com 3 (compose.yaml), a reincidência
      # (POL-HUM-06) tiraria a transação de um consumidor no meio da suíte. A regra, com 3, é
      # testada no backend (tests/test_pre_caso.py, tests/test_politica.py).
      REINCIDENCIA_PRE_CASOS: "10"
  seed:
    environment:
      DATASET_SOURCE: fixture
      DATASET_RAW_DIR: /fixture/raw
      DATASET_MANIFEST_DIR: /fixture/manifesto
    volumes: !override
      - ./data/fixture:/fixture:ro
  e2e:
    environment:
      DATASET_MANIFEST_DIR: /fixture/manifesto
    volumes: !override
      - ./data/fixture:/fixture:ro
