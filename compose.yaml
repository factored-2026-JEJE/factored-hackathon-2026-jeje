# Fonte única de execução e de toda configuração não secreta do produto (ENG-003).
# JEJE_TAG (padrão "local") separa as imagens de execuções paralelas, ex.: gate num worktree.
# Segredos (chaves do S3) ficam só no .env, fora do Git. Suba tudo com: docker compose up --build
name: jeje

# Tabelas do dataset carregadas na camada raw (usada pelo seed e pelo oráculo do e2e).
# digital_events (3,8 GB, 15,6 mi registros) fica fora por padrão: acrescente aqui se precisar.
x-dataset-tables: &dataset-tables branches,customers,products,service_agents,marketing_campaigns,daily_exchange_rates,transactions,call_center_interactions,call_transcripts,satisfaction_surveys,complaints,campaign_sends

# Configuração comum aos processos da aplicação (API, migrações, carga e testes).
x-app-env: &app-env
  API_ROOT_PATH: /api
  DATABASE_URL: postgresql+psycopg://jeje:jeje@db:5432/jeje
  DB_CONNECT_TIMEOUT_S: "3"
  # Pool de conexões por processo: tamanho, excedente e espera máxima por uma conexão (depois, 503).
  DB_POOL_SIZE: "5"
  DB_POOL_MAX_OVERFLOW: "10"
  DB_POOL_TIMEOUT_S: "5"
  # Tempo máximo de um comando SQL da API (a EDA inteira leva ~1 s nos dados reais).
  DB_STATEMENT_TIMEOUT_MS: "5000"
  SESSAO_TTL_MINUTOS: "60"
  # Sessões por persona de demonstração (acesso de teste explícito, sem senha).
  MODO_DEMO: "true"
  # Limites da política simulada do pré-caso, em USD (PRD-001, decididos por Jader em 28/09):
  # até o padrão o assistente registra sozinho; acima, humano (POL-HUM-02).
  LIMITE_PRE_CASO_USD: "5000"
  # À noite (20h–6h) por celular ou computador: por transação e soma do dia (POL-HUM-04).
  LIMITE_NOTURNO_USD: "1000"
  LIMITE_NOTURNO_DIA_USD: "1000"
  NOTURNO_INICIO_H: "20"
  NOTURNO_FIM_H: "6"
  CANAIS_DIGITAIS: "App,Web"
  # Transferência acima disto vai para análise de segurança (POL-SEG-01).
  LIMITE_SEGURANCA_TRANSFERENCIA_USD: "50000"
  PROPOSTA_TTL_MINUTOS: "10"
  # Leitura da mensagem: "regras" (sem modelo) ou "ollama" (modelo local consultado só quando as
  # regras não entendem; ver backend/src/jeje/interpretacao_modelo.py). Regras aqui (testes, carga,
  # migrações); a API da stack de demonstração liga o modelo (serviço api, PRD-003).
  INTERPRETADOR: "regras"
  OLLAMA_URL: http://host.docker.internal:11434
  OLLAMA_MODELO: qwen2.5:7b
  OLLAMA_TIMEOUT_S: "10"
  # Modelo mantido carregado entre turnos (carga fria do qwen2.5:7b leva segundos).
  OLLAMA_KEEP_ALIVE: "30m"
  # A API pede a carga do modelo ao iniciar, em segundo plano (a primeira mensagem já o acha pronto).
  OLLAMA_CARGA_TIMEOUT_S: "120"
  # Logs da aplicação: DEBUG mostra também as sondas de saúde; INFO é o normal.
  LOG_LEVEL: INFO

# Testes do backend: imagem com dependências de desenvolvimento, banco efêmero db-test.
x-backend-test: &backend-test
  build:
    context: ./backend
    target: test
  image: jeje-test:${JEJE_TAG:-local}
  profiles: ["test"]
  volumes:
    - ./contrato:/contrato:ro
  # Integração real com o Ollama pela ponte (make testar-modelo, fora do gate).
  extra_hosts:
    - host.docker.internal:host-gateway
  environment:
    <<: *app-env
    DATABASE_URL: postgresql+psycopg://jeje:jeje@db-test:5432/jeje_test
    # Servidor S3 local de teste (credenciais descartáveis, não são segredo).
    S3_TEST_ENDPOINT: http://s3-test:7070
    S3_TEST_ACCESS_KEY: teste-local
    S3_TEST_SECRET_KEY: segredo-descartavel-de-teste
  depends_on:
    db-test:
      condition: service_healthy
    s3-test:
      condition: service_started

# Testes do frontend: typecheck, lint e vitest com o contrato versionado montado.
x-web-test: &web-test
  build:
    context: ./frontend
    target: test
  image: jeje-web-test:${JEJE_TAG:-local}
  profiles: ["test"]

services:
  db:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_DB: jeje
      POSTGRES_USER: jeje
      # Credencial apenas do banco local de desenvolvimento (porta só em 127.0.0.1).
      # Publicação usa segredo próprio, nunca este valor.
      POSTGRES_PASSWORD: jeje
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jeje -d jeje"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Aplica as migrations e termina; a API só sobe depois que ele conclui com sucesso.
  migrate:
    build:
      context: ./backend
      target: runtime
    image: jeje-api:${JEJE_TAG:-local}
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *app-env
    depends_on:
      db:
        condition: service_healthy

  # Baixa do S3 só o que falta (conferido pelo manifesto versionado) e carrega a camada raw numa
  # transação. Se a versão do manifesto já está no banco, termina na hora.
  seed:
    image: jeje-api:${JEJE_TAG:-local}
    command: ["python", "-m", "jeje.dados", "preparar"]
    environment:
      <<: *app-env
      DATASET_RAW_DIR: /dataset/raw
      DATASET_MANIFEST_DIR: /manifesto
      DATASET_TABLES: *dataset-tables
      DATASET_SOURCE: s3
      DATASET_S3_ENDPOINT: ""
      DATASET_DOWNLOAD_WORKERS: "16"
      PERSONAS_QUANTIDADE: "8"
      AWS_DEFAULT_REGION: us-east-2
    env_file:
      - path: .env
        required: false
    volumes:
      - dataset:/dataset
      - ./data/manifesto:/manifesto:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    image: jeje-api:${JEJE_TAG:-local}
    environment:
      <<: *app-env
      # Modelo local ligado na demonstração (PRD-003); o compose.ci.yaml volta para "regras".
      INTERPRETADOR: "ollama"
    # Ollama do host, quando INTERPRETADOR=ollama (no Linux o nome precisa ser declarado).
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      seed:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Ponte até o Ollama do host (PRD-003): ele escuta só em 127.0.0.1, fora do alcance dos
  # containers. A ponte escuta só no IP do host na rede do Docker (docker0, o host-gateway) e
  # repassa; nada fica exposto na rede local e o Ollama não é reconfigurado. Profile "modelo":
  # só a stack de demonstração sobe (stacks de teste, validação e mutantes não disputam a porta).
  ollama-ponte:
    image: alpine/socat:1.8.1.3@sha256:5ffbd6ae916cbad86a58fabe0d6d5a6fd5c2b47ddf031e82996baac9300e732f
    profiles: ["modelo"]
    network_mode: host
    command: ["TCP-LISTEN:11434,bind=172.17.0.1,fork,reuseaddr", "TCP:127.0.0.1:11434"]

  web:
    build:
      context: ./frontend
      target: runtime
    image: jeje-web:${JEJE_TAG:-local}
    environment:
      API_UPSTREAM: api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 3s
      timeout: 3s
      retries: 20

  # ---- Testes (profile "test"): mesmo código e configuração, banco efêmero em memória ----
  db-test:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    profiles: ["test"]
    environment:
      POSTGRES_DB: jeje_test
      POSTGRES_USER: jeje
      POSTGRES_PASSWORD: jeje
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jeje -d jeje_test"]
      interval: 1s
      timeout: 3s
      retries: 30

  # Servidor compatível com S3 que valida assinatura SigV4: testa download sem depender da AWS.
  s3-test:
    image: versity/versitygw:v1.8.0@sha256:30292fc2eeacc67a36993b01f7a7a5e3361a19cced0e80c1d71cfa2a4b0a2499
    profiles: ["test"]
    environment:
      ROOT_ACCESS_KEY: teste-local
      ROOT_SECRET_KEY: segredo-descartavel-de-teste
    command: ["posix", "/buckets"]
    tmpfs:
      - /buckets

  test:
    <<: *backend-test
    command: ["pytest", "-q"]

  # Lint e formatação do Python (backend e harness de mutantes) com a config do backend.
  lint:
    <<: *backend-test
    depends_on: {}
    volumes:
      - ./mutantes:/mutantes:ro
    command:
      - sh
      - -c
      - ruff check --config pyproject.toml . /mutantes && ruff format --check --config pyproject.toml . /mutantes

  # Prova de sensibilidade (ENG-004): cada mutante registrado precisa derrubar seus testes.
  mutantes:
    <<: *backend-test
    volumes:
      - ./contrato:/contrato:ro
      - ./mutantes:/mutantes:ro
    command: ["python", "/mutantes/executar.py", "/mutantes/backend.json"]

  web-test:
    <<: *web-test
    volumes:
      - ./contrato:/contrato:ro

  mutantes-web:
    <<: *web-test
    volumes:
      - ./contrato:/contrato:ro
      - ./mutantes:/mutantes:ro
    command: ["python3", "/mutantes/executar.py", "/mutantes/web.json"]

  # Jornadas no navegador real (Chromium e Firefox) contra a stack em execução.
  e2e:
    build:
      context: ./e2e
    image: jeje-e2e:${JEJE_TAG:-local}
    profiles: ["e2e"]
    environment:
      BASE_URL: http://web:8080
      # Oráculo independente da versão dos dados: sha256sum dos manifestos montados.
      DATASET_TABLES: *dataset-tables
      DATASET_MANIFEST_DIR: /manifesto
    volumes:
      - ./data/manifesto:/manifesto:ro
    depends_on:
      web:
        condition: service_healthy

  # Mutantes E2E (opt-in): sobe uma stack isolada por mutante usando o Docker do host.
  # Montar o socket dá controle do Docker a este container; use só localmente.
  mutantes-e2e:
    build:
      context: ./mutantes
    image: jeje-mutantes-e2e:${JEJE_TAG:-local}
    profiles: ["mutantes-e2e"]
    working_dir: /repo
    environment:
      # Cópias dos mutantes num caminho idêntico no host e no container: os bind mounts das
      # stacks (ex.: ./data/fixture) são resolvidos pelo daemon Docker do host.
      TMPDIR: /tmp/jeje-mutantes
      # Prefixo dos projetos das stacks; outra execução em paralelo usa outro valor
      # (docker compose run -e MUTANTES_PREFIXO=... mutantes-e2e).
      MUTANTES_PREFIXO: ${MUTANTES_PREFIXO:-jejemut}
    volumes:
      - .:/repo:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/jeje-mutantes:/tmp/jeje-mutantes
    command: ["python3", "/repo/mutantes/executar.py", "/repo/mutantes/e2e.json"]

volumes:
  pgdata:
  dataset:
