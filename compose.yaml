# Fonte única de execução e de toda configuração não secreta do produto (ENG-003).
# Segredos (chaves do S3) ficam só no .env, fora do Git. Suba tudo com: docker compose up --build
name: jeje

# Configuração comum aos processos da aplicação (API, migrações, carga e testes).
x-app-env: &app-env
  API_ROOT_PATH: /api
  DATABASE_URL: postgresql+psycopg://jeje:jeje@db:5432/jeje
  DB_CONNECT_TIMEOUT_S: "3"

# Testes do backend: imagem com dependências de desenvolvimento, banco efêmero db-test.
x-backend-test: &backend-test
  build:
    context: ./backend
    target: test
  image: jeje-test:local
  profiles: ["test"]
  volumes:
    - ./contrato:/contrato:ro
  environment:
    <<: *app-env
    DATABASE_URL: postgresql+psycopg://jeje:jeje@db-test:5432/jeje_test
  depends_on:
    db-test:
      condition: service_healthy

# Testes do frontend: typecheck, lint e vitest com o contrato versionado montado.
x-web-test: &web-test
  build:
    context: ./frontend
    target: test
  image: jeje-web-test:local
  profiles: ["test"]

services:
  db:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_DB: jeje
      POSTGRES_USER: jeje
      # Credencial apenas do banco local de desenvolvimento (porta só em 127.0.0.1).
      # Publicação usa segredo próprio, nunca este valor.
      POSTGRES_PASSWORD: jeje
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jeje -d jeje"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Aplica as migrations e termina; a API só sobe depois que ele conclui com sucesso.
  migrate:
    build:
      context: ./backend
      target: runtime
    image: jeje-api:local
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *app-env
    depends_on:
      db:
        condition: service_healthy

  api:
    image: jeje-api:local
    environment:
      <<: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20

  # ---- Testes (profile "test"): mesmo código e configuração, banco efêmero em memória ----
  db-test:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    profiles: ["test"]
    environment:
      POSTGRES_DB: jeje_test
      POSTGRES_USER: jeje
      POSTGRES_PASSWORD: jeje
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jeje -d jeje_test"]
      interval: 1s
      timeout: 3s
      retries: 30

  test:
    <<: *backend-test
    command: ["pytest", "-q"]

  # Prova de sensibilidade (ENG-004): cada mutante registrado precisa derrubar seus testes.
  mutantes:
    <<: *backend-test
    volumes:
      - ./contrato:/contrato:ro
      - ./mutantes:/mutantes:ro
    command: ["python", "/mutantes/executar.py", "/mutantes/backend.json"]

  web-test:
    <<: *web-test
    volumes:
      - ./contrato:/contrato:ro

  mutantes-web:
    <<: *web-test
    volumes:
      - ./contrato:/contrato:ro
      - ./mutantes:/mutantes:ro
    command: ["python3", "/mutantes/executar.py", "/mutantes/web.json"]

volumes:
  pgdata:
