# Gate completo num runner limpo: segredos no histórico + scripts/repro.sh (clone limpo, stack com a
# fixture versionada, jornadas no navegador, lint, testes e mutantes). Sem nenhum segredo: a
# fixture substitui o dataset real.
#
# Só manual (workflow_dispatch): rodar a cada push consome minutos do plano do GitHub, e ligar
# isso é decisão do time.
name: gate

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "completo (com mutantes) ou rapido"
        type: choice
        options: [completo, rapido]
        default: completo

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks varre o histórico inteiro
          persist-credentials: false
      - name: Segredos no histórico
        run: make segredos
      - name: Reprodução do zero
        env:
          MODO: ${{ inputs.modo }} # via ambiente, nunca interpolado no shell
        run: scripts/repro.sh HEAD "$MODO"
