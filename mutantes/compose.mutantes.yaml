# Override para stacks de mutantes E2E: nada de portas publicadas (convive com o ambiente de
# desenvolvimento), imagens com tag própria (nunca sobrescreve jeje-*:local) e o web sem os testes
# no build (os testes do web rodam à parte, no `make test`).
services:
  db:
    ports: !reset []
  migrate:
    image: jeje-mut-api:${MUTANTE_TAG:?defina MUTANTE_TAG}
  seed:
    image: jeje-mut-api:${MUTANTE_TAG:?defina MUTANTE_TAG}
  api:
    image: jeje-mut-api:${MUTANTE_TAG:?defina MUTANTE_TAG}
    ports: !reset []
  web:
    image: jeje-mut-web:${MUTANTE_TAG:?defina MUTANTE_TAG}
    # Sem os testes do web no build: o mutante precisa subir para a jornada no navegador o pegar.
    build:
      args:
        TESTAR_NO_BUILD: "0"
    ports: !reset []
  e2e:
    image: jeje-mut-e2e:${MUTANTE_TAG:?defina MUTANTE_TAG}
