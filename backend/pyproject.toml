[project]
name = "jeje"
version = "0.1.0"
description = "Backend do produto JEJE — Factored AI & Data Hackathon 2026"
requires-python = ">=3.12,<3.13"
# Versões iguais às do ambiente local validado do time; o uv.lock fixa toda a árvore com hashes.
dependencies = [
  "alembic==1.20.0",
  "boto3==1.43.103",
  "fastapi==0.141.1",
  "joblib==1.6.0",
  "numpy==2.5.3",
  "psycopg[binary]==3.3.6",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "scikit-learn==1.9.1",
  "scipy==1.18.1",
  "sqlalchemy==2.1.1",
  "uvicorn==0.54.0",
]

[dependency-groups]
# Leitor e5 (INTERPRETADOR=leitor): só na imagem de execução e no treino, nunca na de testes (os
# testes usam um codificador falso). No Linux o torch vem do índice só-CPU do PyTorch: o do PyPI
# puxa os pacotes CUDA da NVIDIA (vários GB) que a demo não usa.
leitor = [
  "sentence-transformers==6.1.0",
  "torch==2.14.0",
]
# Treino do leitor (estágio `modelo` da imagem): lê o MInDS-14, que é publicado em parquet.
modelo = [
  "pyarrow==25.0.1",
]
dev = [
  "pytest==9.1.1",
  # Testes do corpus do leitor escrevem um parquet no formato do MInDS-14.
  "pyarrow==25.0.1",
  "httpx2==2.13.1",
  "hypothesis==6.168.2",
  "ruff==0.16.9",
  "schemathesis==4.28.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# Aviso vira erro: depreciação ou dependência errada aparece no teste, não em produção (DEV-020c).
filterwarnings = ["error"]
# Fora do gate: a exploração aleatória do contrato (ACH-027, make contrato-explorar) e a
# integração com o Ollama real, que depende da GPU e da ponte (make testar-modelo).
addopts = "-m 'not exploracao and not ollama'"
markers = [
    "exploracao: exploração aleatória do contrato, fora do gate",
    "ollama: integração com o Ollama real pela ponte do compose, fora do gate",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Erros, imports, bugs prováveis, modernização e simplificações; sem regras cosméticas.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# DDL congelada nas migrations: linhas longas dentro de strings SQL.
"migrations/versions/*" = ["E501"]
