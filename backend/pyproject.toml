[project]
name = "jeje"
version = "0.1.0"
description = "Backend do produto JEJE — Factored AI & Data Hackathon 2026"
requires-python = ">=3.12,<3.13"
# Versões iguais às do ambiente local validado do time; o uv.lock fixa toda a árvore com hashes.
dependencies = [
  "alembic==1.20.0",
  "fastapi==0.141.1",
  "psycopg[binary]==3.3.6",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "sqlalchemy==2.1.1",
  "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "httpx==0.28.1",
  "ruff==0.16.9",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Erros, imports, bugs prováveis, modernização e simplificações; sem regras cosméticas.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
